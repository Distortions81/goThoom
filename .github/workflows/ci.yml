name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libglu1-mesa-dev xorg-dev libxrandr-dev libasound2-dev libgtk-3-dev xdg-utils
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: curl -LO https://m45sci.xyz/u/dist/goThoom/gothoom_deps.tar.gz
      - run: tar -xzf gothoom_deps.tar.gz
      - run: go mod download
      - run: go vet ./...
      - run: go test ./...
